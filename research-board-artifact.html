<title>Paper Trail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0d1210; --panel:#141b18; --panel-2:#181f1c; --ink:#eef2ef; --ink-soft:#8ea89a;
    --ink-faint:#4d5e57; --line:#26332d; --line-soft:#1c2622;
    --paper:#5aa7e0; --finding:#b98ee0; --success:#39d67f; --fail:#e2584f; --neutral:#8ea89a;
    --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:'IBM Plex Sans KR','Pretendard',-apple-system,sans-serif;
  }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
  a{ color:inherit; }

  #app{ display:flex; height:100vh; }

  /* ---- left: search + filter + tree ---- */
  #sidebar{
    width:320px; flex:none; height:100%; overflow-y:auto; background:var(--panel);
    border-right:1px solid var(--line); padding:18px 16px 40px; display:flex; flex-direction:column; gap:16px;
  }
  #sidebar-brand .name{ font-size:15px; font-weight:700; }
  #sidebar-brand .tag{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); }
  #sb-search{
    width:100%; box-sizing:border-box; background:var(--panel-2); border:1px solid var(--line);
    border-radius:7px; color:var(--ink); font-family:'IBM Plex Sans KR',sans-serif; font-size:12.5px;
    padding:8px 10px;
  }
  #sb-search::placeholder{ color:var(--ink-faint); }

  .sb-section-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); margin:0;
  }
  #sb-filters{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft);
    background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:4px 10px;
    cursor:pointer; user-select:none;
  }
  .chip:hover{ border-color:var(--paper); }
  .chip.on{ border-color:var(--paper); color:var(--paper); background:rgba(90,167,224,.1); }
  .chip.on[data-v="failed"]{ border-color:var(--fail); color:var(--fail); background:rgba(226,88,79,.1); }
  .chip.on[data-v="success"]{ border-color:var(--success); color:var(--success); background:rgba(57,214,127,.1); }

  #sb-tree{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .sb-bucket-head{
    display:flex; align-items:center; gap:8px; padding:7px 6px; border-radius:6px; cursor:pointer;
    font-size:12.5px; font-weight:600;
  }
  .sb-bucket-head:hover{ background:var(--panel-2); }
  .sb-bucket-head.current{ color:var(--paper); }
  .sb-bucket-head .car{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint); width:10px; }
  .sb-bucket-head .cnt{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); }
  .sb-items{ display:flex; flex-direction:column; gap:1px; padding-left:18px; }
  .sb-item{
    display:flex; align-items:center; gap:7px; padding:6px 6px; border-radius:5px; cursor:pointer;
    font-size:12px; color:var(--ink-soft);
  }
  .sb-item:hover{ background:var(--panel-2); color:var(--ink); }
  .sb-item.current{ color:var(--paper); background:rgba(90,167,224,.08); }
  .sb-item .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .sb-item .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---- right: staged drill-down canvas ---- */
  #main{ flex:1; height:100%; overflow-y:auto; padding:28px 24px 60px; }
  #breadcrumb{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:20px;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  #breadcrumb a{ color:var(--ink-soft); text-decoration:none; }
  #breadcrumb a:hover{ color:var(--paper); }
  #breadcrumb .cur{ color:var(--ink); }
  #breadcrumb .sep{ color:var(--ink-faint); }

  #stage{ margin:0 auto; max-width:1100px; transition:max-width .28s ease; }
  #stage.lv-buckets{ max-width:1100px; }
  #stage.lv-items{ max-width:820px; }
  #stage.lv-detail{ max-width:600px; }

  @keyframes stageIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  #stage-inner{ animation:stageIn .22s ease; }

  .btn-row{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .tbtn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:7px 12px;
    cursor:pointer;
  }
  .tbtn:hover{ border-color:var(--paper); }

  /* bucket grid (level 0) */
  .bucket-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .bucket-card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--paper);
    border-radius:10px; padding:18px 18px 16px; cursor:pointer; box-shadow:var(--shadow);
  }
  .bucket-card:hover{ border-color:var(--paper); transform:translateY(-2px); }
  .bucket-card .name{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .bucket-card .cnt{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .bucket-card .dots{ display:flex; gap:4px; margin-top:10px; }
  .bucket-card .dots i{ width:7px; height:7px; border-radius:50%; display:block; }

  /* item list (level 1) */
  .item-list{ display:flex; flex-direction:column; gap:8px; }
  .item-row{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-left:3px solid var(--paper); border-radius:8px; padding:12px 14px; cursor:pointer;
  }
  .item-row:hover{ border-color:var(--paper); }
  .item-row .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:3px;
  }
  .item-row .title{ font-size:13.5px; font-weight:600; }
  .item-row .sub{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:3px; }
  .item-row .chev{ margin-left:auto; color:var(--ink-faint); }

  /* detail (level 2 / leaf) */
  .detail-card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--paper);
    border-radius:12px; padding:26px 26px 22px; box-shadow:var(--shadow);
  }
  .detail-card .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    margin:0 0 10px;
  }
  .detail-card h2{ margin:0 0 14px; font-size:19px; line-height:1.35; }
  .detail-card .meta-line{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:16px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .detail-card .meta-line a{ color:var(--paper); text-decoration:none; }
  .detail-card .meta-line a:hover{ text-decoration:underline; }
  .detail-card .text-box{
    background:var(--panel-2); border:1px solid var(--line-soft); border-radius:8px; padding:14px 16px;
    font-size:13px; line-height:1.7; color:var(--ink-soft); margin-bottom:18px; white-space:pre-wrap;
  }
  .detail-card .text-box:empty::before{ content:"(아직 요약이 없습니다 — Claude에게 \"이 논문 읽었는데...\"라고 말해주세요)"; font-style:italic; color:var(--ink-faint); }
  .rel-block{ margin-top:16px; }
  .rel-block .sb-section-label{ margin-bottom:8px; }
  .rel-list{ display:flex; flex-direction:column; gap:6px; }
  .rel-item{
    display:block; font-size:12.5px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; text-decoration:none; cursor:pointer;
  }
  .rel-item:hover{ border-color:var(--paper); }
  .detail-actions{ display:flex; gap:10px; margin-top:20px; }
  .detail-actions button{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  .btn-del{ background:var(--panel-2); color:var(--fail); border:1px solid var(--line); }
  .btn-del:hover{ border-color:var(--fail); }

  #empty-state{ text-align:center; padding:80px 20px; }
  #empty-state .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--paper); margin:0 0 10px; }
  #empty-state h2{ margin:0 0 10px; font-size:19px; }
  #empty-state p{ margin:0 auto; max-width:46ch; font-size:13px; line-height:1.7; color:var(--ink-soft); }

  /* composer */
  #composer{
    position:fixed; z-index:30; width:300px; right:24px; top:24px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:14px; box-shadow:var(--shadow); display:none;
  }
  #composer.show{ display:block; }
  #composer label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-soft); margin:10px 0 5px;
  }
  #composer label:first-of-type{ margin-top:0; }
  #composer input[type=text], #composer textarea, #composer select{
    width:100%; box-sizing:border-box; background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; color:var(--ink); font-family:inherit; font-size:12.5px; padding:7px 9px;
  }
  #composer textarea{ resize:vertical; min-height:52px; }
  #composer .row{ display:flex; gap:8px; }
  #composer .row > *{ flex:1; }
  #composer .actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  #composer .actions button{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  #composer .cancel{ background:var(--panel-2); color:var(--ink-soft); border:1px solid var(--line); }
  #composer .save{ background:var(--paper); color:#08131c; border:1px solid var(--paper); font-weight:600; }

  @media (max-width:760px){
    #sidebar{ width:240px; }
    #composer{ width:calc(100vw - 48px); right:24px; }
  }
</style>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-brand">
      <div class="name">Paper Trail</div>
      <div class="tag mono">// search &amp; filter</div>
    </div>
    <input type="text" id="sb-search" placeholder="제목·저자 검색...">
    <div>
      <p class="sb-section-label">Kind</p>
      <div id="sb-filters" style="margin-top:8px;"></div>
    </div>
    <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
      <p class="sb-section-label" style="margin-bottom:6px;">Browse</p>
      <div id="sb-tree" style="overflow-y:auto;"></div>
    </div>
  </div>

  <div id="main">
    <div id="breadcrumb"></div>
    <div class="btn-row">
      <button type="button" class="tbtn" id="btn-add">＋ 노드</button>
    </div>
    <div id="stage" class="lv-buckets"><div id="stage-inner"></div></div>
  </div>
</div>

<div id="composer">
  <label>종류</label>
  <select id="c-kind">
    <option value="finding">Finding (비교/발견)</option>
    <option value="paper">Paper (논문 메모)</option>
    <option value="experiment">Experiment (실험 결과)</option>
  </select>
  <div id="c-extra-paper" style="display:none;">
    <label>카테고리</label>
    <select id="c-category"></select>
  </div>
  <label>제목</label>
  <input type="text" id="c-title" placeholder="짧은 제목">
  <label>내용</label>
  <textarea id="c-text" placeholder="핵심 내용 2~3문장"></textarea>
  <div id="c-extra-experiment" style="display:none;">
    <label>결과</label>
    <select id="c-status">
      <option value="success">성공</option>
      <option value="failed">실패</option>
      <option value="info">진행중/정보</option>
    </select>
  </div>
  <div id="c-extra-paper2" style="display:none;">
    <div class="row">
      <div><label>저자</label><input type="text" id="c-authors" placeholder="Authors"></div>
      <div><label>연도</label><input type="text" id="c-year" placeholder="2026"></div>
    </div>
    <label>Notion 링크</label>
    <input type="text" id="c-url" placeholder="https://notion.so/...">
  </div>
  <div class="actions">
    <button type="button" class="cancel" id="c-cancel">취소</button>
    <button type="button" class="save" id="c-save">추가</button>
  </div>
</div>

<script>
(function(){
  var KIND_COLOR = { paper:'var(--paper)', finding:'var(--finding)', experiment_success:'var(--success)', experiment_failed:'var(--fail)', experiment_info:'var(--neutral)' };

  var nodes = {};   // id -> data
  var edges = {};   // id -> data
  var drillPath = []; // [] | [bucket] | [bucket, id]
  var filters = { kinds: {}, query: '' }; // kinds: {} means no restriction

  function dotColor(n){
    if(n.kind === 'experiment') return n.status === 'success' ? 'var(--success)' : n.status === 'failed' ? 'var(--fail)' : 'var(--neutral)';
    return n.kind === 'finding' ? 'var(--finding)' : 'var(--paper)';
  }
  function kindLabel(n){
    if(n.kind === 'experiment') return 'EXPERIMENT · ' + (n.status === 'success' ? 'SUCCESS' : n.status === 'failed' ? 'FAILED' : 'INFO');
    return n.kind === 'paper' ? 'PAPER' : 'FINDING';
  }
  function bucketOf(n){
    if(n.category) return n.category;
    return n.kind === 'paper' ? 'Uncategorized' : 'Findings & Experiments';
  }

  function matchesFilters(n){
    if(Object.keys(filters.kinds).length && !filters.kinds[n.kind]) return false;
    if(filters.query){
      var q = filters.query;
      var hay = ((n.title || '') + ' ' + (n.authors || '')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function computeBuckets(){
    var b = {};
    Object.keys(nodes).forEach(function(id){
      var n = nodes[id];
      if(!matchesFilters(n)) return;
      var key = bucketOf(n);
      (b[key] = b[key] || []).push(id);
    });
    Object.keys(b).forEach(function(k){
      b[k].sort(function(a, c){ return (nodes[a].title || '').localeCompare(nodes[c].title || ''); });
    });
    return b;
  }

  // ---------------------------------------------------------------- render
  function render(){
    renderBreadcrumb();
    renderStage();
    renderSidebarTree();
  }

  function renderBreadcrumb(){
    var el = document.getElementById('breadcrumb');
    var parts = ['<a href="#" data-lvl="0">전체</a>'];
    if(drillPath.length >= 1) parts.push('<span class="sep">›</span><a href="#" data-lvl="1">' + escapeHtml(drillPath[0]) + '</a>');
    if(drillPath.length >= 2){
      var n = nodes[drillPath[1]];
      parts.push('<span class="sep">›</span><span class="cur">' + escapeHtml(n ? n.title : '') + '</span>');
    }
    el.innerHTML = parts.join('');
    el.querySelectorAll('a[data-lvl]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        var lvl = parseInt(a.getAttribute('data-lvl'), 10);
        drillPath = drillPath.slice(0, lvl);
        render();
      });
    });
  }

  function stageClassFor(){
    return drillPath.length === 0 ? 'lv-buckets' : drillPath.length === 1 ? 'lv-items' : 'lv-detail';
  }

  function renderStage(){
    var stage = document.getElementById('stage');
    stage.className = stageClassFor();
    var inner = document.createElement('div');
    inner.id = 'stage-inner';

    var buckets = computeBuckets();
    var bucketKeys = Object.keys(buckets).sort();

    if(!Object.keys(nodes).length){
      inner.innerHTML =
        '<div id="empty-state"><p class="eyebrow">// paper trail</p><h2>아직 노드가 없습니다</h2>' +
        '<p>Claude와의 대화에서 "이 논문 여기 추가해줘"라고 말하면 노트가 여기 올라옵니다. ' +
        '직접 빠른 메모를 남기려면 위쪽 "+ 노드" 버튼을 쓰세요.</p></div>';
    } else if(drillPath.length === 0){
      inner.innerHTML = '<div class="bucket-grid">' + bucketKeys.map(function(key){
        var ids = buckets[key];
        var dotsHtml = ids.slice(0, 6).map(function(id){ return '<i style="background:' + dotColor(nodes[id]) + '"></i>'; }).join('');
        return (
          '<div class="bucket-card" data-bucket="' + escapeAttr(key) + '">' +
            '<div class="name">' + escapeHtml(key) + '</div>' +
            '<div class="cnt mono">' + ids.length + '개</div>' +
            '<div class="dots">' + dotsHtml + '</div>' +
          '</div>'
        );
      }).join('') + '</div>';
      if(!bucketKeys.length) inner.innerHTML = '<div id="empty-state"><h2>검색/필터 결과가 없습니다</h2></div>';
    } else if(drillPath.length === 1){
      var ids1 = buckets[drillPath[0]] || [];
      inner.innerHTML =
        '<div class="item-list">' + ids1.map(function(id){
          var n = nodes[id];
          var sub = n.kind === 'paper' ? [n.authors, n.year].filter(Boolean).join(' · ') : (n.metric || '');
          return (
            '<div class="item-row" data-id="' + id + '" style="border-left-color:' + dotColor(n) + '">' +
              '<div>' +
                '<div class="eyebrow">' + kindLabel(n) + '</div>' +
                '<div class="title">' + escapeHtml(n.title || '(제목 없음)') + '</div>' +
                (sub ? '<div class="sub">' + escapeHtml(sub) + '</div>' : '') +
              '</div>' +
              '<span class="chev">›</span>' +
            '</div>'
          );
        }).join('') + '</div>';
      if(!ids1.length) inner.innerHTML = '<div id="empty-state"><h2>이 카테고리엔 항목이 없습니다</h2></div>';
    } else {
      inner.innerHTML = renderDetail(drillPath[1]);
    }

    stage.innerHTML = '';
    stage.appendChild(inner);
    wireStageEvents();
  }

  function renderDetail(id){
    var n = nodes[id];
    if(!n) return '<div id="empty-state"><h2>노드를 찾을 수 없습니다</h2></div>';
    var color = dotColor(n);
    var metaBits = [];
    if(n.kind === 'paper'){
      if(n.authors) metaBits.push(escapeHtml(n.authors));
      if(n.year) metaBits.push(n.year);
      if(n.notionUrl) metaBits.push('<a href="' + escapeAttr(n.notionUrl) + '" target="_blank" rel="noopener">Notion &#8599;</a>');
    } else if(n.kind === 'experiment' && n.metric){
      metaBits.push(escapeHtml(n.metric));
    }

    var cites = [], citedBy = [];
    Object.keys(edges).forEach(function(eid){
      var e = edges[eid];
      if(e.from === id && nodes[e.to]) cites.push(e.to);
      if(e.to === id && nodes[e.from]) citedBy.push(e.from);
    });

    function relList(title, ids){
      if(!ids.length) return '';
      return (
        '<div class="rel-block"><p class="sb-section-label">' + title + ' (' + ids.length + ')</p>' +
        '<div class="rel-list">' + ids.map(function(rid){
          return '<a class="rel-item" data-jump="' + rid + '">' + escapeHtml(nodes[rid].title || rid) + '</a>';
        }).join('') + '</div></div>'
      );
    }

    return (
      '<div class="detail-card" style="border-left-color:' + color + '">' +
        '<p class="eyebrow" style="color:' + color + '">' + kindLabel(n) + '</p>' +
        '<h2>' + escapeHtml(n.title || '(제목 없음)') + '</h2>' +
        (metaBits.length ? '<div class="meta-line">' + metaBits.join(' <span class="sep">·</span> ') + '</div>' : '') +
        '<div class="text-box">' + escapeHtml(n.text || '') + '</div>' +
        relList('인용한 논문', cites) +
        relList('이 논문을 인용', citedBy) +
        '<div class="detail-actions"><button type="button" class="btn-del" id="btn-detail-del">이 노드 삭제</button></div>' +
      '</div>'
    );
  }

  function wireStageEvents(){
    document.querySelectorAll('.bucket-card').forEach(function(el){
      el.addEventListener('click', function(){
        drillPath = [el.getAttribute('data-bucket')];
        render();
      });
    });
    document.querySelectorAll('.item-row').forEach(function(el){
      el.addEventListener('click', function(){
        drillPath = [drillPath[0], el.getAttribute('data-id')];
        render();
      });
    });
    document.querySelectorAll('.rel-item').forEach(function(el){
      el.addEventListener('click', function(){
        var rid = el.getAttribute('data-jump');
        drillPath = [bucketOf(nodes[rid]), rid];
        render();
      });
    });
    var delBtn = document.getElementById('btn-detail-del');
    if(delBtn) delBtn.addEventListener('click', function(){ deleteNode(drillPath[1]); });
  }

  // ------------------------------------------------------------ sidebar tree
  var sbExpanded = {}; // bucket -> bool

  function renderSidebarTree(){
    var el = document.getElementById('sb-tree');
    var buckets = computeBuckets();
    var keys = Object.keys(buckets).sort();
    var searching = !!filters.query;
    el.innerHTML = keys.map(function(key){
      var ids = buckets[key];
      var open = searching || sbExpanded[key] || drillPath[0] === key;
      var itemsHtml = open ? ids.map(function(id){
        var n = nodes[id];
        var cur = drillPath[1] === id;
        return (
          '<div class="sb-item' + (cur ? ' current' : '') + '" data-id="' + id + '" data-bucket="' + escapeAttr(key) + '">' +
            '<span class="dot" style="background:' + dotColor(n) + '"></span>' +
            '<span class="t">' + escapeHtml(n.title || '(제목 없음)') + '</span>' +
          '</div>'
        );
      }).join('') : '';
      return (
        '<div class="sb-bucket-head' + (drillPath[0] === key && drillPath.length === 1 ? ' current' : '') + '" data-bucket="' + escapeAttr(key) + '">' +
          '<span class="car">' + (open ? '▾' : '▸') + '</span>' +
          '<span>' + escapeHtml(key) + '</span>' +
          '<span class="cnt">' + ids.length + '</span>' +
        '</div>' +
        (open ? '<div class="sb-items">' + itemsHtml + '</div>' : '')
      );
    }).join('');

    el.querySelectorAll('.sb-bucket-head').forEach(function(head){
      head.addEventListener('click', function(){
        var key = head.getAttribute('data-bucket');
        if(filters.query){ drillPath = [key]; render(); return; }
        sbExpanded[key] = !sbExpanded[key];
        renderSidebarTree();
      });
    });
    el.querySelectorAll('.sb-item').forEach(function(item){
      item.addEventListener('click', function(e){
        e.stopPropagation();
        drillPath = [item.getAttribute('data-bucket'), item.getAttribute('data-id')];
        render();
      });
    });
  }

  // ------------------------------------------------------------------ util
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // ------------------------------------------------------------- filters ui
  var KIND_OPTIONS = [['paper', 'Paper'], ['finding', 'Finding'], ['experiment', 'Experiment']];
  function renderFilters(){
    var el = document.getElementById('sb-filters');
    el.innerHTML = KIND_OPTIONS.map(function(k){
      return '<span class="chip' + (filters.kinds[k[0]] ? ' on' : '') + '" data-kind="' + k[0] + '">' + k[1] + '</span>';
    }).join('');
    el.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var k = chip.getAttribute('data-kind');
        if(filters.kinds[k]) delete filters.kinds[k]; else filters.kinds[k] = true;
        renderFilters();
        render();
      });
    });
  }

  document.getElementById('sb-search').addEventListener('input', function(e){
    filters.query = e.target.value.trim().toLowerCase();
    render();
  });

  // -------------------------------------------------------------- db wiring
  var db = null, nodesCol = null, edgesCol = null;

  function persistDelete(id){ if(nodesCol) nodesCol.doc(id).delete().catch(function(){}); }

  function deleteNode(id){
    delete nodes[id];
    Object.keys(edges).forEach(function(eid){
      if(edges[eid].from === id || edges[eid].to === id){
        var eeid = eid;
        delete edges[eeid];
        if(edgesCol) edgesCol.doc(eeid).delete().catch(function(){});
      }
    });
    persistDelete(id);
    drillPath = drillPath.slice(0, 1);
    render();
  }

  function addNode(data){
    var id = 'n-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    nodes[id] = data;
    if(nodesCol) nodesCol.doc(id).set(data).catch(function(){});
    drillPath = [bucketOf(data), id];
    render();
  }

  async function initDb(){
    try { db = await window.claude.use('db'); } catch(e){ db = null; }
    if(!db) return;
    nodesCol = db.collection('nodes');
    edgesCol = db.collection('edges');
    nodesCol.onSnapshot(function(snap){
      nodes = {};
      snap.docs.forEach(function(d){ nodes[d.id] = d.data(); });
      render();
    }, function(){});
    edgesCol.onSnapshot(function(snap){
      edges = {};
      snap.docs.forEach(function(d){ edges[d.id] = d.data(); });
      if(drillPath.length === 2) render(); // detail view shows cites/cited-by
    }, function(){});
  }

  // ----------------------------------------------------------------- composer
  var CATEGORY_OPTIONS = ['Vision', 'Language', 'Speech-Audio', 'Time-Series', 'Multimodal', 'Robotics', 'Graph-Network', 'Generative', 'Algorithms', 'Uncategorized'];
  var composer = document.getElementById('composer');
  var cKind = document.getElementById('c-kind');
  var cCategory = document.getElementById('c-category');
  var cTitle = document.getElementById('c-title');
  var cText = document.getElementById('c-text');
  var cStatus = document.getElementById('c-status');
  var cAuthors = document.getElementById('c-authors');
  var cYear = document.getElementById('c-year');
  var cUrl = document.getElementById('c-url');

  cCategory.innerHTML = CATEGORY_OPTIONS.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');

  function updateComposerFields(){
    var isExp = cKind.value === 'experiment';
    var isPaper = cKind.value === 'paper';
    document.getElementById('c-extra-experiment').style.display = isExp ? 'block' : 'none';
    document.getElementById('c-extra-paper').style.display = isPaper ? 'block' : 'none';
    document.getElementById('c-extra-paper2').style.display = isPaper ? 'block' : 'none';
  }
  cKind.addEventListener('change', updateComposerFields);

  document.getElementById('btn-add').addEventListener('click', function(){ composer.classList.add('show'); cTitle.focus(); });
  document.getElementById('c-cancel').addEventListener('click', function(){
    composer.classList.remove('show');
    cTitle.value = ''; cText.value = ''; cAuthors.value = ''; cYear.value = ''; cUrl.value = '';
  });
  document.getElementById('c-save').addEventListener('click', function(){
    if(!cTitle.value.trim()){ cTitle.focus(); return; }
    var data = { kind: cKind.value, title: cTitle.value.trim(), text: cText.value.trim(), status: 'info' };
    if(cKind.value === 'experiment') data.status = cStatus.value;
    if(cKind.value === 'paper'){
      data.category = cCategory.value;
      if(cAuthors.value.trim()) data.authors = cAuthors.value.trim();
      if(cYear.value.trim()) data.year = cYear.value.trim();
      if(cUrl.value.trim()) data.notionUrl = cUrl.value.trim();
    }
    addNode(data);
    document.getElementById('c-cancel').click();
  });
  updateComposerFields();

  renderFilters();
  render();
  initDb();
})();
</script>
